[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py39"
line-length = 120
include = [
    "setup.py",
    "Backend/main.py",
    "Backend/web.py",
    "Backend/Utils/mouse.py",
    "Backend/Utils/screen.py",
    "Backend/config/*.py",
    "tests/unit/*.py",
]
exclude = [
    "Backend/ultralytics",
    "Backend/Utils/Algorithm",
    "Backend/Utils/exporter.py",
    "Backend/Utils/modelAnalyser.py",
    "Backend/Utils/silencePredictor.py",
    "train",
    "tests/test_*.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["Backend"]
addopts = "-ra --strict-markers --confcutdir=tests/unit"
